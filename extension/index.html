    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>

    <symbol id="i-more" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>

  </svg>

  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="brand-text">
          <strong>OctoFiesta</strong>
          <span>Web Player <em class="version-badge">1.2.1</em></span>
        </div>
      </div>

      <nav id="nav">
        <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span data-i18n="nav_home">Inicio</span></a>
        <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg><span data-i18n="nav_search">Buscar</span></a>
        <a href="#/albums" data-nav="albums"><svg class="ic"><use href="#i-disc"/></svg><span data-i18n="nav_albums">Álbumes</span></a>
        <a href="#/artists" data-nav="artists"><svg class="ic"><use href="#i-mic"/></svg><span data-i18n="nav_artists">Artistas</span></a>
        <a href="#/playlists" data-nav="playlists"><svg class="ic"><use href="#i-list"/></svg><span data-i18n="nav_playlists">Listas</span></a>
        <a href="#/starred" data-nav="starred"><svg class="ic"><use href="#i-star"/></svg><span data-i18n="nav_favorites">Favoritas</span></a>
        <a href="#/random" data-nav="random"><svg class="ic"><use href="#i-dice"/></svg><span data-i18n="nav_random">Aleatorio</span></a>
      </nav>

      <div class="sidebar-footer">
        <button id="btn-settings" class="nav-btn" title="Configuración del servidor">
          <svg class="ic"><use href="#i-settings"/></svg><span data-i18n="nav_server">Servidor</span>
        </button>
        <button id="btn-about" class="nav-btn" title="Acerca de">
          <svg class="ic"><use href="#i-info"/></svg><span data-i18n="nav_about">Acerca de</span>
        </button>
        <div class="lang-row">
          <svg class="ic lang-globe"><use href="#i-globe"/></svg>
          <select id="lang-select" title="Idioma / Language">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="brand-credit"><span data-i18n="created_by">Creado por</span> <strong>duendeakrata</strong></div>
      </div>
    </aside>

    <main id="main"></main>
  </div>

  <!-- ======= Player bar ======= -->
  <footer id="playerbar">
    <div id="pb-track">
      <div id="pb-cover" class="cover-sm">
        <div class="cover-placeholder"><svg class="ic"><use href="#i-music"/></svg></div>
        <img id="pb-cover-img" alt="" hidden>
      </div>
      <div id="pb-info">
        <div id="pb-title" data-i18n="no_track">Sin reproducción</div>
        <div id="pb-artist" data-i18n="connect_hint">Conecta tu servidor OctoFiesta</div>
      </div>
      <button id="pb-add-playlist" class="icon-btn" data-i18n-title="add_to_playlist" title="Añadir a lista" data-hidden>
        <svg class="ic"><use href="#i-list"/></svg>
      </button>
      <button id="pb-star" class="icon-btn" data-i18n-title="btn_favorite" title="Marcar como favorita" data-hidden>
        <svg class="ic"><use href="#i-star"/></svg>
      </button>
    </div>

    <div id="pb-controls">
      <div class="pb-row-top">
        <button id="pb-shuffle" class="icon-btn" data-i18n-title="btn_random" title="Aleatorio">
          <svg class="ic"><use href="#i-shuffle"/></svg>
        </button>
        <button id="pb-prev" class="icon-btn" data-i18n-title="btn_previous" title="Anterior">
          <svg class="ic"><use href="#i-prev"/></svg>
        </button>
        <button id="pb-play" class="btn-play" data-i18n-title="btn_play_pause" title="Reproducir / Pausar">
          <svg class="ic"><use href="#i-play"/></svg>
        </button>
        <button id="pb-next" class="icon-btn" data-i18n-title="btn_next" title="Siguiente">
          <svg class="ic"><use href="#i-next"/></svg>
        </button>
        <button id="pb-repeat" class="icon-btn" data-i18n-title="btn_repeat" title="Repetir">
          <svg class="ic"><use href="#i-repeat"/></svg>
        </button>
      </div>
      <div class="pb-row-bottom">
        <span id="pb-current" class="pb-time">0:00</span>
        <input id="pb-seek" type="range" min="0" max="1000" value="0" step="1">
        <span id="pb-duration" class="pb-time">0:00</span>
      </div>
    </div>

    <div id="pb-right">
      <button id="pb-lyrics" class="icon-btn" data-i18n-title="btn_lyrics" title="Letras" data-hidden>
        <svg class="ic"><use href="#i-lyrics"/></svg>
      </button>
      <button id="pb-queue" class="icon-btn" data-i18n-title="btn_queue" title="Cola de reproducción">
        <svg class="ic"><use href="#i-queue"/></svg>
      </button>
      <div id="pb-volume">
        <button id="pb-mute" class="icon-btn" data-i18n-title="btn_mute" title="Silenciar">
          <svg class="ic"><use href="#i-volume"/></svg>
        </button>
        <input id="pb-vol" type="range" min="0" max="100" value="80" step="1">
      </div>
    </div>
  </footer>

  <!-- ======= Panels (queue / lyrics) ======= -->
  <div id="panel-queue" class="slide-panel" hidden>
    <div class="panel-head">
      <h3 data-i18n="panel_queue">Cola de reproducción</h3>
      <button class="icon-btn panel-close" data-close="panel-queue"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div id="queue-list" class="panel-body"></div>
  </div>

  <div id="panel-lyrics" class="slide-panel" hidden>
    <div class="panel-head">
      <h3 data-i18n="panel_lyrics">Letras</h3>
      <button class="icon-btn panel-close" data-close="panel-lyrics"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div id="lyrics-body" class="panel-body lyrics"></div>
  </div>

  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <script src="js/i18n.js?v=19"></script>
  <script src="js/md5.js?v=19"></script>
  <script src="js/api.js?v=19"></script>
  <script src="js/player.js?v=19"></script>
  <script src="js/ui.js?v=19"></script>
  <script src="js/views.js?v=19"></script>
  <script src="js/app.js?v=19"></script>
</body>
</html>
